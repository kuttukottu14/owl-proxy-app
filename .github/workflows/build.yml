name: Build Owl Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare Web Assets & Install Capacitor
      run: |
        mkdir -p www
        cp index.html style.css app.js www/ 2>/dev/null || echo "Files copied"
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Owl Proxy Ultra" "com.owlproxy.app" --web-dir www
        npx cap add android
        npx cap copy android

    - name: Fix Duplicate Classes & Build APK
      run: |
        cd android
        # Duplicate classes సమస్య రాకుండా build.gradle లో exclusions యాడ్ చేయడం
        echo "
        android {
            packagingOptions {
                exclude 'META-INF/kotlinstdlib.kotlin_module'
                exclude 'META-INF/versions/9/previous-compilation-data.bin'
            }
        }
        " >> app/build.gradle
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Working APK
      uses: actions/upload-artifact@v4
      with:
        name: OwlProxy-Ultra-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
