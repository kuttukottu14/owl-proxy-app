name: Build Web APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Build Webview APK with Node
      run: |
        npm install -g nativefier || true

    - name: Create Web Package
      run: |
        mkdir -p output
        tar -cvf output/app-files.tar index.html

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: owl-proxy-files
        path: output/
