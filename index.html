here<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owl Proxy App</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
    .card { background: #1e293b; padding: 25px; border-radius: 16px; margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    button { background: #22c55e; color: white; border: none; padding: 15px 35px; font-size: 18px; border-radius: 10px; cursor: pointer; }
    .disconnected { background: #ef4444; }
    select { padding: 12px; font-size: 16px; border-radius: 8px; width: 100%; max-width: 300px; margin-bottom: 20px; background: #334155; color: white; border: 1px solid #475569; }
  </style>
</head>
<body>

  <h1>🦉 Owl Proxy App</h1>
  
  <div class="card">
    <label for="country"><b>దేశాన్ని / IP ని ఎంచుకోండి:</b></label><br><br>
    <select id="country">
      <option value="104.248.63.15:8080">🇺🇸 United States (104.248.63.15)</option>
      <option value="159.69.202.13:3128">🇩🇪 Germany (159.69.202.13)</option>
      <option value="185.199.108.153:8080">🇬🇧 United Kingdom (185.199.108.153)</option>
    </select>
    
    <br><br>
    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    <h3 id="status">Status: Disconnected ❌</h3>
  </div>

  <script>
    let isConnected = false;

    function toggleConnection() {
      const btn = document.getElementById('connectBtn');
      const status = document.getElementById('status');
      const proxy = document.getElementById('country').value;

      if (!isConnected) {
        status.innerText = "Status: Connecting to " + proxy + "...";
        setTimeout(() => {
          status.innerText = "Status: Connected ✅ (" + proxy + ")";
          btn.innerText = "Disconnect";
          btn.classList.add("disconnected");
          isConnected = true;
        }, 1500);
      } else {
        status.innerText = "Status: Disconnected ❌";
        btn.innerText = "Connect";
        btn.classList.remove("disconnected");
        isConnected = false;
      }
    }
  </script>
</body>
</html>
