<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owl Proxy Ultra - Agent Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">🦉 <span>Owl Proxy Ultra</span></div>
            <div class="balance-box">Data: <span id="dataBalance">0M</span></div>
        </header>

        <div class="generator-card">
            <h3>Generate Route</h3>

            <div class="form-group">
                <label>* Country / Region</label>
                <select id="countrySelect" onchange="updateStates()">
                    <option value="">Please select...</option>
                    <option value="US">United States (US)</option>
                    <option value="CN">China (CN)</option>
                    <option value="GB">United Kingdom (GB)</option>
                    <option value="DE">Germany (DE)</option>
                    <option value="IN">India (IN)</option>
                    <option value="SG">Singapore (SG)</option>
                    <option value="LY">Libya (LY)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>State / Province</label>
                    <select id="stateSelect" onchange="updateCities()">
                        <option value="">Select state...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <select id="citySelect">
                        <option value="">Select City</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>IP Rotation Cycle</label>
                    <select id="rotationSelect">
                        <option value="5">5 minutes</option>
                        <option value="10">10 minutes</option>
                        <option value="15">15 minutes</option>
                        <option value="30">30 minutes</option>
                        <option value="60">60 minutes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Agreement</label>
                    <select id="agreementSelect">
                        <option value="SOCKS5">SOCKS5</option>
                        <option value="HTTP">HTTP</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Format</label>
                    <select id="formatSelect">
                        <option value="1">Host:Port:Username:Password</option>
                        <option value="2">Username:Password@Host:Port</option>
                        <option value="3">Username:Password:Host:Port</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantityInput" value="1" min="1" max="50">
                </div>
            </div>

            <button id="extractBtn" onclick="extractProxy()">Extract</button>
        </div>

        <div class="agent-info-card">
            <h3>Agent Info</h3>
            <textarea id="agentOutput" readonly placeholder="Please extract proxy lines first"></textarea>
            <div class="action-buttons">
                <button onclick="copyProxies()">Batch Copy</button>
                <button onclick="exportProxies()">Export</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
