<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owl Proxy Lite</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #0f172a; color: white; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-top: 20px; }
    button { background: #22c55e; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; }
    .disconnected { background: #ef4444; }
    select { padding: 10px; font-size: 16px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h1>🦉 Owl Proxy App</h1>
  
  <div class="card">
    <label for="country">దేశాన్ని ఎంచుకోండి:</label><br><br>
    <select id="country">
      <option value="104.248.63.15:8080">🇺🇸 United States</option>
      <option value="159.69.202.13:3128">🇩🇪 Germany</option>
    </select>
    
    <br><br>
    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    <h3 id="status">Status: Disconnected</h3>
  </div>

  <script>
    let isConnected = false;

    function toggleConnection() {
      const btn = document.getElementById('connectBtn');
      const status = document.getElementById('status');
      const proxy = document.getElementById('country').value;

      if (!isConnected) {
        // కనెక్ట్ అయ్యే లాజిక్
        status.innerText = "Status: Connecting to " + proxy + "...";
        setTimeout(() => {
          status.innerText = "Status: Connected ✅ (" + proxy + ")";
          btn.innerText = "Disconnect";
          btn.classList.add("disconnected");
          isConnected = true;
        }, 2000);
      } else {
        // డిస్‌కనెక్ట్ అయ్యే లాజిక్
        status.innerText = "Status: Disconnected ❌";
        btn.innerText = "Connect";
        btn.classList.remove("disconnected");
        isConnected = false;
      }
    }
  </script>
</body>
</html>
